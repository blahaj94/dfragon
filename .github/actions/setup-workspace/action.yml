name: Set up workspace
description: Install Node.js, pnpm and the locked workspace dependencies without lifecycle scripts.

inputs:
  node-auth-token:
    description: Token that can read the @blahaj94 packages on GitHub Packages
    required: true

runs:
  using: composite
  steps:
    # setup-node needs pnpm on PATH to find and cache the pnpm store.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'
        registry-url: https://npm.pkg.github.com
        scope: '@blahaj94'
        cache: pnpm
    - run: pnpm install --frozen-lockfile --ignore-scripts
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.node-auth-token }}
