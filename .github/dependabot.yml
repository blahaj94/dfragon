version: 2
updates:
  - package-ecosystem: github-actions
    # "/" covers .github/workflows. Composite actions live under .github/actions.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']

  # Version-pinned license overrides require manual updates in the same PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      vite-vitest:
        patterns: ['vite', 'vitest', '@vitejs/*', '@vitest/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      base-ui:
        patterns: ['@base-ui/*']
      electron:
        patterns: ['electron', 'electron-builder', 'electron-vite', '@electron-toolkit/*']
      stylex:
        patterns: ['@stylexjs/*']
      minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    # Names in both the default and a named catalog are updated by hand: Dependabot reads the
    # named catalog version but writes the default catalog (#691 downgraded TypeScript 7 to 6).
    ignore:
      - dependency-name: vite
      - dependency-name: '@vitejs/plugin-react'
      - dependency-name: '@types/node'
      - dependency-name: typescript
      # Dependabot handling of this npm alias has not been verified.
      - dependency-name: typescript-compiler-api

  # Dependabot reads literal FROM images without resolving ARG defaults.
  - package-ecosystem: docker
    directories: ['/apps/accounts', '/apps/api', '/apps/ocr']
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      node-image:
        patterns: ['node']
    # Node majors must follow the server engines (<27) and Electron plan.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
