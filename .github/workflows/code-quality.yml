name: Code Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test:security-dependencies
      - run: pnpm test:product-images
      - run: node --test scripts/test/server-build-info.test.mjs
      - run: pnpm --filter @dfragon/licenses test
      - run: pnpm --filter @dfragon/lib test
      - run: pnpm --filter @dfragon/api test
      - run: pnpm --filter @dfragon/accounts test
      - run: pnpm --filter @dfragon/ocr test
      - name: Test Desktop core behavior
        run: pnpm --filter @dfragon/desktop test
      - name: Test Desktop search against the public API
        run: pnpm --filter @dfragon/desktop exec vitest run --config scripts/search-server-integration/vitest.config.ts
      - run: pnpm lint
      - run: pnpm test:format-policy
      - run: pnpm format:check
      - run: pnpm lint:oxlint
      - name: Select images from the complete main push
        if: github.event_name == 'push'
        run: node scripts/product-image-plan.mjs select "$RUNNER_TEMP/product-image-plan.json"
      - name: Transfer the image plan to Product Images
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-image-plan
          overwrite: true
          path: ${{ runner.temp }}/product-image-plan.json
          retention-days: 7
          if-no-files-found: error
