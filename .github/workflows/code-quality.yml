name: Code Quality

on:
  pull_request:
  push:
    branches: [main]
  # Run workflow on any branch from the Actions page to run the full suite without (build).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  # A newer PR push replaces the running check. Main runs finish so each pushed commit keeps a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pre-push runs pnpm verify locally, so CI repeats only the cheap checks on every PR. The other
  # check jobs run when the PR title scope is (build), as Build Scope decides.
  scope:
    name: Build scope
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/build-scope.yml

  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check:writing
      - run: pnpm check:docs

  tooling:
    name: Repository tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Test repository tooling
        run: pnpm test:tooling

  packages:
    name: Shared packages
    needs: scope
    if: needs.scope.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @dfragon/licenses test
      - run: pnpm --filter @dfragon/lib test
      - run: pnpm --filter @dfragon/ui test

  desktop:
    name: Desktop test
    needs: scope
    if: needs.scope.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: ./.github/actions/setup-workspace
      - name: Prepare Electron for Desktop tests
        run: pnpm --filter @dfragon/desktop exec install-electron
      - name: Test Desktop core behavior without prebuilt shared libraries
        run: pnpm --filter @dfragon/desktop test

  desktop-typecheck:
    name: Desktop typecheck
    needs: scope
    if: needs.scope.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Typecheck Desktop main, preload and renderer
        run: pnpm --filter @dfragon/desktop typecheck

  api:
    name: API test
    needs: scope
    if: needs.scope.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @dfragon/api test

  web:
    name: Web test and build
    needs: scope
    if: needs.scope.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @dfragon/web test
      - name: Typecheck and bundle Web
        run: pnpm --filter @dfragon/web build

  desktop-search:
    name: Desktop search integration
    needs: scope
    if: needs.scope.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      # The search client imports api-fetch, which loads the electron package.
      - name: Prepare Electron for the Desktop search test
        run: pnpm --filter @dfragon/desktop exec install-electron
      # The integration test starts the built apps/api/dist runtime.
      - name: Build API for the integration test
        run: pnpm --filter @dfragon/api build
      - name: Test Desktop search against the public API
        run: pnpm --filter @dfragon/desktop exec vitest run --config scripts/search-server-integration/vitest.config.ts

  image-plan:
    name: Select images from the main push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - name: Select images from the complete main push
        run: node scripts/product-image-plan.mjs select "$RUNNER_TEMP/product-image-plan.json"
      # Product Images reads this artifact only after the whole Code Quality run succeeds.
      - name: Transfer the image plan to Product Images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: product-image-plan
          overwrite: true
          path: ${{ runner.temp }}/product-image-plan.json
          retention-days: 7
          if-no-files-found: error

  # The main ruleset requires this check name. It passes when the build scope and the checks that
  # always run succeeded and every other check job succeeded or was skipped without (build).
  lint-and-format:
    if: always()
    needs:
      - scope
      - static
      - tooling
      - packages
      - desktop
      - desktop-typecheck
      - api
      - web
      - desktop-search
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Code Quality job to succeed or skip without (build)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          REQUIRED_RESULTS: ${{ needs.scope.result }} ${{ needs.static.result }} ${{ needs.tooling.result }}
        run: |
          if [[ -z "$RESULTS" ]]; then
            echo "No Code Quality job results reached the aggregate check"
            exit 1
          fi

          for result in $REQUIRED_RESULTS; do
            if [[ "$result" != success ]]; then
              echo "A Code Quality job that always runs finished with: $result"
              exit 1
            fi
          done

          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "A Code Quality job finished with: $result"
                exit 1
                ;;
            esac
          done
