# The snapshot correlator is "<workflow name> <job id>". Keep "Dependency Review submit" so each run
# replaces the snapshot that the earlier Dependency Review workflow submitted instead of adding beside it.
name: Dependency Review

on:
  push:
    branches: [main]
    paths:
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/dependency-snapshot.yml'
      - 'scripts/dependency-snapshot.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-snapshot
  cancel-in-progress: true

jobs:
  # GitHub's static graph reads only the pnpm binary document of the pnpm 11 or later lockfile.
  # Submit the workspace document so Dependabot alerts include transitive dependencies.
  submit:
    name: Submit pnpm dependencies
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Dependency submission API requires write access to contents.
    env:
      SNAPSHOT_SHA: ${{ github.sha }}
      SNAPSHOT_REF: ${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - run: pnpm sbom --sbom-format cyclonedx --lockfile-only --out "$RUNNER_TEMP/pnpm.cdx.json"
      - run: node scripts/dependency-snapshot.mjs "$RUNNER_TEMP/pnpm.cdx.json" "$RUNNER_TEMP/dependency-snapshot.json"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" --input "$RUNNER_TEMP/dependency-snapshot.json"
