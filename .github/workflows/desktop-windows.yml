name: Desktop Windows

on:
  # Pull requests run without a paths filter so the required gate always reports. The changes job
  # applies the push paths below to the pull request instead.
  pull_request:
  push:
    branches: [main]
    paths:
      - '.gitattributes'
      - '.gitmodules'
      - '.npmrc'
      - '.github/workflows/desktop-windows.yml'
      - 'apps/desktop/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Desktop changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.paths.outputs.needed }}
    steps:
      # The test merge commit and its two parents are enough to list the pull request changes.
      - name: Checkout the pull request merge commit
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Match the pull request changes against the push paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # A main push reaches this job only through the push paths filter.
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The first parent of the test merge commit is the base branch it merges into.
          if ! git rev-parse --verify --quiet 'HEAD^2' > /dev/null; then
            echo "The pull request checkout is not a merge commit"
            exit 1
          fi

          # These pathspecs cover the push paths filter. A file moved out of them still counts.
          status=0
          git diff --name-only --exit-code --no-renames 'HEAD^1' HEAD -- \
            .gitattributes .gitmodules .npmrc .github/workflows/desktop-windows.yml \
            apps/desktop packages package.json pnpm-lock.yaml pnpm-workspace.yaml || status=$?

          case "$status" in
            0) echo "needed=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "needed=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

  test:
    name: Desktop tests on Windows (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      # A failing shard must not cancel the other one, so a failure shows its full scope.
      fail-fast: false
      # The Desktop suite is the longest PR job on a Windows runner, so two runners each take half
      # of the test files. The runner setup is paid twice to roughly halve the wall-clock time.
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@blahaj94'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PIANO_SOUND_PACKAGES_TOKEN }}
      # Electron no longer downloads its binary during install. Tests that load the electron
      # package would otherwise download it from several Vitest workers at once.
      - name: Prepare Electron for Desktop tests
        run: pnpm --filter @dfragon/desktop exec install-electron
      # GitHub hosted runners execute with an elevated administrator token. The fixture is not
      # sharded, so one runner is enough for it.
      - name: Run Windows native security fixture
        if: matrix.shard == '1/2'
        run: pnpm --filter @dfragon/desktop test:windows-native
      - name: Test Desktop on Windows
        env:
          VITEST_SHARD: ${{ matrix.shard }}
        run: pnpm --filter @dfragon/desktop test --shard "$env:VITEST_SHARD"

  # The main ruleset can require this stable check name. Skipped tests pass when the pull request
  # changed no Desktop path.
  gate:
    name: Desktop Windows gate
    if: always()
    needs:
      - changes
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Desktop Windows job to succeed or skip
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [[ -z "$RESULTS" ]]; then
            echo "No Desktop Windows job results reached the gate"
            exit 1
          fi

          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "A Desktop Windows job finished with: $result"
                exit 1
                ;;
            esac
          done
