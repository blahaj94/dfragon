name: Desktop Windows

on:
  pull_request:
    paths:
      - '.gitattributes'
      - '.gitmodules'
      - '.npmrc'
      - '.github/workflows/desktop-windows.yml'
      - 'apps/desktop/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches: [main]
    paths:
      - '.gitattributes'
      - '.gitmodules'
      - '.npmrc'
      - '.github/workflows/desktop-windows.yml'
      - 'apps/desktop/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Windows native fixture and Desktop tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@blahaj94'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PIANO_SOUND_PACKAGES_TOKEN }}
      # GitHub hosted runners execute with an elevated administrator token.
      - name: Run Windows native security fixture
        run: pnpm --filter @dfragon/desktop test:windows-native
      - name: Test Desktop on Windows
        run: pnpm --filter @dfragon/desktop test
