name: Windows Portable

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '첨부할 기존 Release 태그 (예: v0.0.1)'
        required: true
        type: string
      api_origin:
        description: '배포 API HTTPS origin (비우면 production 환경 변수 사용)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.event.release.tag_name || inputs.tag }}
  # Release and manual builds finish so a tag keeps its asset.
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    # Release variables live in the production environment, which only main and v* tag runs can use.
    environment: production
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      DFRAGON_CHANNEL: distribution
      # The API origin has no channels.json default and must be configured.
      DFRAGON_DISTRIBUTION_API_ORIGIN: ${{ inputs.api_origin || vars.DFRAGON_DISTRIBUTION_API_ORIGIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          # Release builds must not restore package caches that other runs could have written.
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Check release configuration
        id: release
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const match = /^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$/.exec(process.env.RELEASE_TAG ?? '');
          if (!match) {
            throw new Error('Release tag must use v<version>, for example v0.0.1 or v0.0.1-beta.1.');
          }
          const version = match[1];
          if (!process.env.DFRAGON_DISTRIBUTION_API_ORIGIN) {
            throw new Error('Set DFRAGON_DISTRIBUTION_API_ORIGIN in the production environment or the api_origin input.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE
      # Check the checked-out commit, not the tag name, so a moved tag cannot bypass the check.
      - name: Require a main commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_COMMIT=$(git rev-parse HEAD)
          main_relation=$(gh api "repos/$GITHUB_REPOSITORY/compare/$RELEASE_COMMIT...main?per_page=1" --jq .status)
          if [[ "$main_relation" != ahead && "$main_relation" != identical ]]; then
            echo "::error::Release tag $RELEASE_TAG points to $RELEASE_COMMIT, which is not on main."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      # The score engine submodule is private, so the recursive checkout skips it (update = none in .gitmodules).
      - name: Fetch score engine submodule
        shell: bash
        env:
          DFRAGON_SCORE_ENGINE_TOKEN: ${{ secrets.DFRAGON_SCORE_ENGINE_TOKEN }}
        run: |
          if [[ -z "$DFRAGON_SCORE_ENGINE_TOKEN" ]]; then
            echo "DFRAGON_SCORE_ENGINE_TOKEN is not set. Building without the score engine."
            exit 0
          fi
          basic=$(printf 'x-access-token:%s' "$DFRAGON_SCORE_ENGINE_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$basic"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" \
            submodule update --init --checkout --depth 1 packages/models/score-engine
      # --require fails a release build that cannot place the score engine.
      - name: Prepare score engine
        run: pnpm --filter @dfragon/desktop prepare:score-engine --require
      - run: pnpm --filter @dfragon/desktop build:distribution
      - name: Package portable executable with release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        # Release builds keep the electron-builder default 7z level 9; test builds lower it in their own workflow.
        run: pnpm --filter @dfragon/desktop exec electron-builder --win portable --x64 --publish never --config.extraMetadata.version="$RELEASE_VERSION"
      - name: Write portable executable checksum
        shell: bash
        working-directory: apps/desktop/dist
        run: |
          set -euo pipefail
          for executable in DFragon-*-x64-portable.exe; do
            # Write the sha256sum format with LF so Linux and Windows tools read the same file.
            hash=$(sha256sum "$executable" | cut -d ' ' -f 1)
            printf '%s  %s\n' "$hash" "$executable" > "$executable.sha256"
            sha256sum --check "$executable.sha256"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-portable
          path: |
            apps/desktop/dist/DFragon-*-x64-portable.exe
            apps/desktop/dist/DFragon-*-x64-portable.exe.sha256
          if-no-files-found: error
          retention-days: 7

  upload-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      # Sign provenance here, outside the job that runs dependency install scripts.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-portable
          path: release
      - name: Verify transferred executable checksum
        working-directory: release
        run: sha256sum --check DFragon-*-x64-portable.exe.sha256
      - name: Attest portable executable provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/DFragon-*-x64-portable.exe
      - name: Attach portable executable and checksum to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" release/DFragon-*-x64-portable.exe release/DFragon-*-x64-portable.exe.sha256
