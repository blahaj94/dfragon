name: Windows Portable

on:
  pull_request:
    paths:
      - '.gitattributes'
      - '.github/workflows/desktop-release.yml'
      - 'apps/desktop/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '첨부할 기존 Release 태그 (예: v0.0.1)'
        required: true
        type: string
      api_origin:
        description: '배포 API HTTPS origin (비우면 저장소 변수 사용)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      DFRAGON_DISTRIBUTION_API_ORIGIN: ${{ github.event_name == 'pull_request' && 'https://api.example.test' || inputs.api_origin || vars.DFRAGON_DISTRIBUTION_API_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - name: Check release configuration
        id: release
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          let { version } = JSON.parse(readFileSync('apps/desktop/package.json', 'utf8'));
          if (process.env.RELEASE_TAG) {
            const match = /^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$/.exec(process.env.RELEASE_TAG);
            if (!match) {
              throw new Error('Release tag must use v<version>, for example v0.0.1 or v0.0.1-beta.1.');
            }
            version = match[1];
          }
          if (!process.env.DFRAGON_DISTRIBUTION_API_ORIGIN) {
            throw new Error('Set the DFRAGON_DISTRIBUTION_API_ORIGIN repository variable or api_origin input.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dfragon/desktop build:distribution
      - name: Package portable executable with release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: pnpm --filter @dfragon/desktop exec electron-builder --win portable --x64 --publish never --config.extraMetadata.version="$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-portable
          path: apps/desktop/dist/DFRAGON-*-x64-portable.exe
          if-no-files-found: error
          retention-days: 7

  upload-release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-portable
          path: release
      - name: Attach portable executable to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" release/DFRAGON-*-x64-portable.exe
