name: Product Images

on:
  pull_request:
  workflow_run:
    workflows: [Code Quality]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  # workflow_run's github.sha can be a newer main commit. Never build that SHA.
  SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  select:
    name: Select changed images
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Select images changed by the PR
        if: github.event_name == 'pull_request'
        run: node scripts/product-image-plan.mjs select "$RUNNER_TEMP/product-image-plan.json"
      # Read only the successful main Code Quality run that triggered this workflow.
      # Its plan includes every commit in that push, not just head_sha's last commit.
      - name: Download the tested main image plan
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: product-image-plan
          path: ${{ runner.temp }}
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Find the last successful publication
        if: github.event_name == 'workflow_run'
        id: baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/product-image-plan.mjs baseline
      - name: Download the previous successful image plan
        if: github.event_name == 'workflow_run' && steps.baseline.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: product-image-plan
          path: ${{ runner.temp }}/image-baseline
          github-token: ${{ github.token }}
          run-id: ${{ steps.baseline.outputs.run_id }}
      - name: Include changes not yet published
        if: github.event_name == 'workflow_run'
        env:
          BASELINE_RUN_ID: ${{ steps.baseline.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$BASELINE_RUN_ID" ]]; then
            node scripts/product-image-plan.mjs catch-up "$RUNNER_TEMP/product-image-plan.json" "$RUNNER_TEMP/image-baseline/product-image-plan.json"
          else
            node scripts/product-image-plan.mjs catch-up "$RUNNER_TEMP/product-image-plan.json"
          fi
      - name: Validate the plan and expose the build matrix
        id: plan
        run: node scripts/product-image-plan.mjs output "$RUNNER_TEMP/product-image-plan.json"
      # Only a fully successful build/publication run becomes the next baseline.
      - name: Save the publication plan for the next main run
        if: github.event_name == 'workflow_run'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-image-plan
          path: ${{ runner.temp }}/product-image-plan.json
          retention-days: 90
          overwrite: true
          if-no-files-found: error

  build:
    name: Build image (${{ matrix.service }})
    needs: select
    if: needs.select.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - name: Verify source commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Tests run in Code Quality. Main builds start only after that run succeeds.
      # The existing Dockerfiles also retain their server-build validation.
      - name: Build image without registry credentials
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: false
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ env.SOURCE_COMMIT }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_COMMIT }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
      - name: Transfer the main image to the publishing job
        if: github.event_name == 'workflow_run'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: built-image-${{ matrix.service }}
          path: ${{ runner.temp }}/image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish image (${{ matrix.service }})
    needs: [select, build]
    if: >-
      needs.select.outputs.has_changes == 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      SERVICE: ${{ matrix.service }}
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.service }}
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      # Download only from this workflow run. Never consume PR workflow artifacts.
      # This job does not checkout source or execute code inside the image.
      - name: Download the built image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-image-${{ matrix.service }}
          path: ${{ runner.temp }}/built-image
      - name: Load and verify image metadata
        shell: bash
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/built-image/image.tar"
          test "$(docker image inspect "$IMAGE:$SOURCE_COMMIT" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$SOURCE_COMMIT"
          test "$(docker image inspect "$IMAGE:$SOURCE_COMMIT" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')" = "$SOURCE_URL"
          test "$(docker image inspect "$IMAGE:$SOURCE_COMMIT" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the built image
        shell: bash
        run: docker push "$IMAGE:$SOURCE_COMMIT"
      - name: Verify the registry digest and write handoff
        shell: bash
        run: |
          set -euo pipefail
          # Use this push's local RepoDigest: a concurrent rerun can overwrite the tag.
          reference=$(docker image inspect "$IMAGE:$SOURCE_COMMIT" --format '{{json .RepoDigests}}' | \
            jq -er --arg image "$IMAGE" '[.[] | select(startswith($image + "@sha256:"))] | if length == 1 then .[0] else error("Expected one pushed digest") end')
          digest="${reference##*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker manifest inspect "$reference" >/dev/null
          mkdir -p "$RUNNER_TEMP/image-handoff"
          jq -n --arg service "$SERVICE" --arg image "$reference" --arg sourceCommit "$SOURCE_COMMIT" \
            '{service: $service, image: $image, sourceCommit: $sourceCommit}' \
            > "$RUNNER_TEMP/image-handoff/$SERVICE.json"
          {
            printf '| Service | Image reference | Source commit |\n| --- | --- | --- |\n'
            printf '| %s | `%s` | `%s` |\n' "$SERVICE" "$reference" "$SOURCE_COMMIT"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload image handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-handoff-${{ matrix.service }}
          path: ${{ runner.temp }}/image-handoff/${{ matrix.service }}.json
          if-no-files-found: error
