name: Workflow Lint

on:
  # Pull requests run without a paths filter so the required gate always reports. The changes job
  # applies the push paths below to the pull request instead.
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/**'

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect workflow changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.paths.outputs.needed }}
    steps:
      # The test merge commit and its two parents are enough to list the pull request changes.
      - name: Checkout the pull request merge commit
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Match the pull request changes against the push paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # A main push reaches this job only through the push paths filter.
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The first parent of the test merge commit is the base branch it merges into.
          if ! git rev-parse --verify --quiet 'HEAD^2' > /dev/null; then
            echo "The pull request checkout is not a merge commit"
            exit 1
          fi

          # This pathspec covers the push paths filter. A file moved out of it still counts.
          status=0
          git diff --name-only --exit-code --no-renames 'HEAD^1' HEAD -- .github || status=$?

          case "$status" in
            0) echo "needed=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "needed=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

  actionlint:
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      # The runner's preinstalled shellcheck also checks run: scripts.
      - name: Lint workflows
        run: '"$RUNNER_TEMP/actionlint"'

  zizmor:
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Findings fail this job as annotations. No SARIF upload or PR review comments.
      - name: Audit workflows, actions and Dependabot config
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

  # The main ruleset can require this stable check name. Skipped lint jobs pass when the pull
  # request changed nothing under .github.
  gate:
    name: Workflow Lint gate
    if: always()
    needs:
      - changes
      - actionlint
      - zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Workflow Lint job to succeed or skip
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [[ -z "$RESULTS" ]]; then
            echo "No Workflow Lint job results reached the gate"
            exit 1
          fi

          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "A Workflow Lint job finished with: $result"
                exit 1
                ;;
            esac
          done
