name: Deploy Linux

on:
  workflow_run:
    workflows: [Code Quality]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-linux-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Join the private deployment network
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.DFRAGON_TAILSCALE_CLIENT_ID }}
          audience: ${{ secrets.DFRAGON_TAILSCALE_AUDIENCE }}
          tags: tag:dfragon-ci
          use-cache: 'false'
      - name: Deploy the successful main commit
        env:
          DEPLOY_HOST: ${{ secrets.DFRAGON_DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DFRAGON_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DFRAGON_DEPLOY_KNOWN_HOSTS }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          umask 077
          key_file=$(mktemp)
          hosts_file=$(mktemp)
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts_file"
          unset DEPLOY_KEY DEPLOY_KNOWN_HOSTS
          ssh_options=(-i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file"
            -o HostKeyAlias=dfragon-production -o ConnectTimeout=30
            -o ServerAliveInterval=20 -o ServerAliveCountMax=3)
          result=0
          # Expand the locally validated SHA for the server's forced-command parser.
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "dfragon-deploy@$DEPLOY_HOST" "deploy $RELEASE_COMMIT" || result=$?
          ssh "${ssh_options[@]}" "dfragon-deploy@$DEPLOY_HOST" status || result=1
          exit "$result"
