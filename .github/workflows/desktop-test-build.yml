name: Windows Test Build

on:
  pull_request:
    paths:
      - '.gitattributes'
      - '.gitmodules'
      - '.npmrc'
      - '.github/workflows/desktop-test-build.yml'
      - 'apps/desktop/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Build scope
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/build-scope.yml

  build:
    needs: scope
    if: needs.scope.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    # The test environment holds test-build secrets. PR builds are not deployments, so record none.
    environment:
      name: test
      deployment: false
    env:
      DFRAGON_CHANNEL: test
      TEST_VERSION: 0.0.0-test.${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare score engine
        run: pnpm --filter @dfragon/desktop prepare:score-engine
      - run: pnpm --filter @dfragon/desktop build:test
      - name: Package the test channel portable executable
        shell: bash
        run: pnpm --filter @dfragon/desktop exec electron-builder --win portable --x64 --publish never --config.extraMetadata.version="$TEST_VERSION"
      - name: Write portable executable checksum
        shell: bash
        working-directory: apps/desktop/dist/test
        run: |
          set -euo pipefail
          for executable in DFragon-Test-*-x64-portable.exe; do
            # Write the sha256sum format with LF so Linux and Windows tools read the same file.
            hash=$(sha256sum "$executable" | cut -d ' ' -f 1)
            printf '%s  %s\n' "$hash" "$executable" > "$executable.sha256"
            sha256sum --check "$executable.sha256"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-portable-test
          path: |
            apps/desktop/dist/test/DFragon-Test-*-x64-portable.exe
            apps/desktop/dist/test/DFragon-Test-*-x64-portable.exe.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Describe how to download the build
        shell: bash
        run: |
          {
            echo "Test channel build \`$TEST_VERSION\` (\`던삐삐 Test\`, \`dfragon-test.exe\`)."
            echo
            echo "Download in PowerShell on a Windows PC with the GitHub CLI. It prints nothing on success, creates the folder,"
            echo "and refuses to overwrite existing files, so keep one folder per run:"
            echo
            echo '```powershell'
            # Escape $HOME so the summary shows the PowerShell variable instead of the runner's home.
            echo "gh run download $GITHUB_RUN_ID --repo $GITHUB_REPOSITORY -n windows-x64-portable-test -D \"\$HOME\\Downloads\\dfragon-test-$GITHUB_RUN_ID\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
