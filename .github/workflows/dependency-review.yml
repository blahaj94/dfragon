name: Dependency Review

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # GitHub's static graph reads only the pnpm binary document of the pnpm 11 lockfile.
  # Submit the workspace document so alerts and review include transitive dependencies.
  submit:
    name: Submit pnpm dependencies
    # Fork PR tokens cannot write snapshots. Their review falls back to the static graph.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      # Dependency review compares the PR head commit, not the merge commit in github.sha.
      SNAPSHOT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SNAPSHOT_REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.head_ref) || github.ref }}
    steps:
      - name: Checkout the snapshot commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Read every workspace package from the lockfile
        run: pnpm sbom --sbom-format cyclonedx --lockfile-only --out "$RUNNER_TEMP/pnpm.cdx.json"
      - name: Convert the SBOM to a dependency snapshot
        run: node scripts/dependency-snapshot.mjs "$RUNNER_TEMP/pnpm.cdx.json" "$RUNNER_TEMP/dependency-snapshot.json"
      - name: Submit the dependency snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" --input "$RUNNER_TEMP/dependency-snapshot.json"
