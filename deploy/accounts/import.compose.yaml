# Temporary maintenance-only bridge. Never attach the accounts runtime to the API database network.
services:
  import-auth:
    extends:
      file: compose.yaml
      service: migrate
    command: [node, --import, reflect-metadata, dist/database/import/cli.js, --writes-stopped]
    environment:
      AUTH_IMPORT_SOURCE_FILE: /run/secrets/import_source
      AUTH_IMPORT_LEGACY_RP_ID: ${AUTH_IMPORT_LEGACY_RP_ID:?Set the existing RP ID after checking deployed auth configuration}
    secrets:
      - import_source
    networks: [database, legacy_database]
networks:
  legacy_database:
    external: true
    name: ${AUTH_IMPORT_SOURCE_NETWORK:-dfragon_database}
secrets:
  import_source:
    file: ${DFRAGON_SECRETS_DIR}/import_source.json
